<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Coin Tasks</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px;
    font-family: -apple-system, system-ui, sans-serif;
    background: var(--tg-theme-bg-color, #fff);
    color: var(--tg-theme-text-color, #111);
  }
  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px; margin-bottom: 16px; border-radius: 12px;
    background: var(--tg-theme-secondary-bg-color, #f3f3f3);
  }
  .topbar .username { font-size: 14px; font-weight: 500; opacity: 0.85; }
  .coin-badge {
    display: flex; align-items: center; gap: 4px;
    padding: 4px 10px; border-radius: 999px;
    background: var(--tg-theme-bg-color, #fff);
    font-size: 13px; font-weight: 700;
  }
  .coin-badge .icon { font-size: 13px; }
  .mission {
    padding: 12px 14px; margin-bottom: 16px; border-radius: 12px;
    background: var(--tg-theme-secondary-bg-color, #f3f3f3);
    border: 1px solid transparent;
  }
  .mission.complete { border-color: #2ecc71; }
  .mission-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .mission-progress { font-size: 13px; opacity: 0.7; }
  h2 { font-size: 15px; opacity: 0.7; margin: 20px 0 8px; }
  .task {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px; margin-bottom: 8px; border-radius: 12px;
    background: var(--tg-theme-secondary-bg-color, #f3f3f3);
  }
  .task .title { font-size: 15px; font-weight: 500; }
  .task .reward { font-size: 13px; opacity: 0.6; }
  button {
    padding: 8px 16px; border-radius: 10px; border: none;
    background: var(--tg-theme-button-color, #2481cc);
    color: var(--tg-theme-button-text-color, #fff);
    font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: 0.4; cursor: default; }
</style>
</head>
<body>

<div class="topbar">
  <div class="username" id="username">User</div>
  <div class="coin-badge"><span class="icon">🪙</span><span id="coinBalance">0</span></div>
</div>

<div class="mission" id="missionCard">
  <div class="mission-title">Daily Mission</div>
  <div class="mission-progress" id="missionProgress">0/0 tasks completed today</div>
  <div id="missionCodeBlock" style="display:none; margin-top: 10px;">
    <div style="font-size:12px; opacity:0.7; margin-bottom:4px;">Send this code with your screenshot as proof:</div>
    <div style="display:flex; align-items:center; gap:8px;">
      <div id="missionCode" style="font-size:18px; font-weight:700; letter-spacing:2px;">--------</div>
      <button id="copyCodeBtn" style="padding:4px 10px; font-size:12px;">Copy</button>
    </div>
  </div>
</div>

<h2>Visit Channel Tasks</h2>
<div id="visitTasks"></div>

<h2>Watch Ad Tasks</h2>
<div class="task">
  <div><div class="title">Adsgram Ad</div><div class="reward">+4 coins</div></div>
  <button id="btnAdsgram">Watch</button>
</div>
<div class="task">
  <div><div class="title">Monetag Ad</div><div class="reward">+2 coins</div></div>
  <button id="btnMonetag">Watch</button>
</div>

<h2>Join Channel Tasks</h2>
<div id="channelTasks"></div>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready();
tg?.expand();

// ---- Backend location ----
// Frontend is hosted on GitHub Pages (static files only, no API routes).
// The two server endpoints (channel verification, daily proof code) live
// on Vercel, so we call them with an absolute URL instead of a relative
// "/api/..." path.
// ⚠️ REPLACE this with your actual Vercel deployment URL after you deploy.
const API_BASE_URL = "https://coin-tasks-backend.vercel.app";

const telegramUser = tg?.initDataUnsafe?.user;

// ---- Task config (mirrors tasks.config.js on the backend) ----
const CHANNEL_TASKS = [
  { id: "rewardhubzone",          link: "https://t.me/rewardhubzone",          coin: 1 },
  { id: "telegarmtask",           link: "https://t.me/telegarmtask",           coin: 1 },
  { id: "earnfreecryptoreward",   link: "https://t.me/earnfreecryptoreward",   coin: 1 },
  { id: "BinanceRedpacketdailyi", link: "https://t.me/BinanceRedpacketdailyi", coin: 1 },
  { id: "rewardcoinse",           link: "https://t.me/rewardcoinse",           coin: 1 },
];

// Visit tasks: unlike join tasks, Telegram has no API to verify a "visit" —
// only membership. So these are click-and-credit with no server check.
// Easy to farm by design; fine here since coins have no payout value.
const VISIT_TASKS = [
  { id: "rewardhubzone-visit",          link: "https://t.me/rewardhubzone",          coin: 1 },
  { id: "telegarmtask-visit",           link: "https://t.me/telegarmtask",           coin: 1 },
  { id: "earnfreecryptoreward-visit",   link: "https://t.me/earnfreecryptoreward",   coin: 1 },
  { id: "BinanceRedpacketdailyi-visit", link: "https://t.me/BinanceRedpacketdailyi", coin: 1 },
  { id: "rewardcoinse-visit",           link: "https://t.me/rewardcoinse",           coin: 1 },
  { id: "DailyCryptoRewardsbot-visit",  link: "https://t.me/DailyCryptoRewardsbot",  coin: 1 },
];

// ---- localStorage helpers ----
const STORAGE_KEY = "coin_tasks_state_v1";

function todayStr() {
  // Local date, e.g. "2026-08-27" — daily mission resets when this changes.
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
}

function loadState() {
  const defaults = {
    coins: 0,
    completedChannels: [],
    completedVisits: [],
    adsWatchedToday: { adsgram: 0, monetag: 0 },
    lastResetDate: todayStr(),
    dailyCode: null,       // fetched from /api/daily-code once mission completes
    dailyCodeDate: null,   // which date the stored code is for
  };
  try {
    const loaded = JSON.parse(localStorage.getItem(STORAGE_KEY));
    let merged = loaded ? { ...defaults, ...loaded } : defaults;

    // New day? Reset visit + ad task state so the daily mission starts
    // fresh — but NOT channel joins, which are one-time only and never
    // need re-verifying.
    if (merged.lastResetDate !== todayStr()) {
      merged = {
        ...merged,
        completedVisits: [],
        adsWatchedToday: { adsgram: 0, monetag: 0 },
        lastResetDate: todayStr(),
        dailyCode: null,
        dailyCodeDate: null,
      };
    }
    return merged;
  } catch {
    return defaults;
  }
}
function saveState(state) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

let state = loadState();
saveState(state); // persist reset immediately if a new day just kicked in

function renderBalance() {
  document.getElementById("coinBalance").textContent = state.coins;
}

function renderUsername() {
  const el = document.getElementById("username");
  if (telegramUser) {
    // Telegram username (@handle) isn't always set — fall back to first name.
    el.textContent = telegramUser.username ? `@${telegramUser.username}` : (telegramUser.first_name || "User");
  } else {
    el.textContent = "Guest";
  }
}

function renderChannelTasks() {
  const container = document.getElementById("channelTasks");
  container.innerHTML = "";
  CHANNEL_TASKS.forEach(task => {
    const done = state.completedChannels.includes(task.id);
    const row = document.createElement("div");
    row.className = "task";
    row.innerHTML = `
      <div>
        <div class="title">${task.id}</div>
        <div class="reward">+${task.coin} coin</div>
      </div>
      <button data-id="${task.id}" ${done ? "disabled" : ""}>${done ? "Done" : "Join"}</button>
    `;
    container.appendChild(row);
  });

  container.querySelectorAll("button:not(:disabled)").forEach(btn => {
    btn.addEventListener("click", () => handleChannelClaim(btn.dataset.id));
  });
}

async function handleChannelClaim(channelId) {
  const task = CHANNEL_TASKS.find(t => t.id === channelId);
  // Open channel first so user can actually join.
  tg?.openTelegramLink ? tg.openTelegramLink(task.link) : window.open(task.link, "_blank");

  // Give them a moment to join, then verify.
  setTimeout(async () => {
    if (!telegramUser?.id) {
      alert("Open this inside Telegram to verify.");
      return;
    }
    try {
      const res = await fetch(`${API_BASE_URL}/api/verify-membership`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ channel_username: channelId, telegram_user_id: telegramUser.id }),
      });
      const data = await res.json();
      if (data.is_member) {
        state.coins += task.coin;
        state.completedChannels.push(channelId);
        saveState(state);
        renderBalance();
        renderChannelTasks();
        renderMission();
      } else {
        alert("Join the channel first, then tap again.");
      }
    } catch (err) {
      console.error(err);
      alert("Couldn't verify right now, try again.");
    }
  }, 1500);
}

function renderVisitTasks() {
  const container = document.getElementById("visitTasks");
  container.innerHTML = "";
  VISIT_TASKS.forEach(task => {
    const done = state.completedVisits.includes(task.id);
    const row = document.createElement("div");
    row.className = "task";
    row.innerHTML = `
      <div>
        <div class="title">${task.id.replace("-visit", "")}</div>
        <div class="reward">+${task.coin} coin</div>
      </div>
      <button data-id="${task.id}" ${done ? "disabled" : ""}>${done ? "Done" : "Visit"}</button>
    `;
    container.appendChild(row);
  });

  container.querySelectorAll("button:not(:disabled)").forEach(btn => {
    btn.addEventListener("click", () => handleVisitClaim(btn.dataset.id));
  });
}

function handleVisitClaim(taskId) {
  const task = VISIT_TASKS.find(t => t.id === taskId);
  tg?.openTelegramLink ? tg.openTelegramLink(task.link) : window.open(task.link, "_blank");

  // No verification possible for "visit" — credit after a short delay
  // just so it's not an instant zero-effort click. Not real fraud protection.
  setTimeout(() => {
    state.coins += task.coin;
    state.completedVisits.push(taskId);
    saveState(state);
    renderBalance();
    renderVisitTasks();
    renderMission();
  }, 3000);
}

// ---- Ad tasks (stub — wire in real Adsgram/Monetag SDK callbacks) ----
document.getElementById("btnAdsgram").addEventListener("click", () => {
  // Replace with real Adsgram SDK call, e.g.:
  // AdsgramSDK.show().then(() => creditAdCoins("adsgram", 4));
  creditAdCoins("adsgram", 4);
});
document.getElementById("btnMonetag").addEventListener("click", () => {
  // Replace with real Monetag SDK call, e.g.:
  // show_9999999().then(() => creditAdCoins("monetag", 2));
  creditAdCoins("monetag", 2);
});

function creditAdCoins(network, amount) {
  // IMPORTANT: only call this from the ad SDK's "ad fully watched" callback,
  // never from the button click directly — otherwise users just farm clicks.
  state.coins += amount;
  state.adsWatchedToday[network] = (state.adsWatchedToday[network] || 0) + 1;
  saveState(state);
  renderBalance();
  renderMission();
}

// ---- Daily Mission: visit tasks + at least 1 ad from each network,
// completed today. Channel-join is excluded — it's one-time, verified
// once and never re-checked. Fully automatic — no screenshots, no manual
// review, just localStorage state that resets at local midnight.
function renderMission() {
  const totalTasks = VISIT_TASKS.length + 2; // +2 = 1 adsgram + 1 monetag view. Join tasks are one-time, not daily.
  const doneTasks =
    state.completedVisits.length +
    Math.min(state.adsWatchedToday.adsgram, 1) +
    Math.min(state.adsWatchedToday.monetag, 1);

  const card = document.getElementById("missionCard");
  const progress = document.getElementById("missionProgress");
  const codeBlock = document.getElementById("missionCodeBlock");
  const codeEl = document.getElementById("missionCode");
  const isComplete = doneTasks >= totalTasks;

  card.classList.toggle("complete", isComplete);
  progress.textContent = isComplete
    ? "✅ All done for today — resets tomorrow"
    : `${doneTasks}/${totalTasks} tasks completed today`;

  if (!isComplete) {
    codeBlock.style.display = "none";
    return;
  }

  const today = todayStr();
  if (state.dailyCode && state.dailyCodeDate === today) {
    // Already fetched today's code — just show it.
    codeEl.textContent = state.dailyCode;
    codeBlock.style.display = "block";
    return;
  }

  if (!telegramUser?.id) {
    progress.textContent += " (open in Telegram to get your proof code)";
    return;
  }

  fetch(`${API_BASE_URL}/api/daily-code`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ telegram_user_id: telegramUser.id }),
  })
    .then(res => res.json())
    .then(data => {
      if (!data.code) return;
      state.dailyCode = data.code;
      state.dailyCodeDate = today;
      saveState(state);
      codeEl.textContent = data.code;
      codeBlock.style.display = "block";
    })
    .catch(err => console.error("Couldn't fetch proof code:", err));
}

document.getElementById("copyCodeBtn").addEventListener("click", () => {
  const code = document.getElementById("missionCode").textContent;
  navigator.clipboard?.writeText(code).then(() => {
    tg?.HapticFeedback?.notificationOccurred("success");
  }).catch(() => {});
});

// ---- init ----
renderBalance();
renderUsername();
renderChannelTasks();
renderVisitTasks();
renderMission();
</script>
</body>
</html>
